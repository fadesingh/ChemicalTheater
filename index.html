<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chemical Theatre ASCII Animation</title>
    <style>
        body {
            background-color: white;
            color: #333;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #canvas {
            font-size: 12px;
            line-height: 1;
            white-space: pre;
        }
    </style>
</head>
<body>
    <div id="canvas"></div>

    <script>
        const canvas = document.getElementById('canvas');
        let frame = 0;

        const baseStructure = `
 ___________________________________________________________________________________________
|                                                                                           |
|    ☿   ~   ☽      ∞           ♄     ☉                                                     |
|  ~ (∿∿∿) ~     ☼   ◊ ~  ⚶  /╲_☿_/╲                                                        |
| ☽   ╭─────╮    ~   ⚛   ∇  □ ∫ ◯    ◊                                                     |
|◊ ∞ ⚗│PRIMA│   ☼    ♁ ~ ◊    ∫   ⚛  ∞  ~   ╔══════════════════════════════════════════╗   |
|⚛ ☾ ⚗│     │ ⚗ ╔═════╗  ⚶   /╲◯◊◯/╲       ║                                          ║   |
|◊ ⚗ ⚗│MATER│⚗ ⚗║CHAOS║  □ ~  ∇ ∫  ∫ ☼     ║                                          ║   |
|⚗ ⚗ ⚗│     │⚗ ⚗╚═╦═══╝ ◊      ♃  ⚶  ∫     ║                                          ║   |
| ⚗ ⚗ ╰─────╯ ⚗   ║    ~  ◊  ☉    □        ║                                          ║   |
|⚗ ⚗ ⚗  ◌  ⚗ ⚗ ⚗  ▼     ☼  □ ♀     ◊       ║                                          ║   |
| ⚗ ⚗ ⚗   ⚗ ⚗ ⚗ /╲__/╲  ⚛   ∇  ⚶  ~        ║                                          ║   |
|  ⚗ ⚗ ⚗ ⚗ ⚗ ⚗ ╲╱  ☉    ∞     □           ╚══════════════════════════════════════════╝   |
|   ⚗ ⚗ ~ ⚗ ⚗  ◯    ◊ ~    ☽  ∇                                                           |
|    ⚗  ⚛  ⚗ (∿∿∿) ~  ☼ ♂   ◊  ~                                                          |
| □   ∇ ☽ ∞    ♄   ⚶  □  ∞  ⚛                                                             |
|  ☉   ◊    ☼   □   ◊    ♃                                                                 |
|___________________________________________________________________________________________|
        `;

        const textFragments = [
            "Chemical Theatre: A mathematical journey with @fadesingh",
            "Act One - Atomic Drift",
            "This workshop aims to simulate chemical reactions inside a computer",
            "and render them as animated videos.",
            "We are not concerned here with normal chemistry,",
            "but with artificial or fictional chemistries.",
            "We will simulate a particle which does not exist in any known periodic table,",
            "and then we will define how these particles interact.",
            "Through this interaction we hope that strange, alien worlds will emerge.",
            "You'd be playing a video game like a God trying to bring a tiny universe to life.",
            "You'll have the source code so you can modify the rules and behaviour as we go.",
            "We may think of atoms as actors on a cosmic stage -",
            "colliding, colluding and drifting into the unknown.",
            "And you are the omnipotent director.",
            "Themes: linear algebra, quantum mechanics, random processes,",
            "time series analysis, probability, group theory, entropy, thermodynamics and more.",
            "If you are above 20, curious about scientific and mathematical ideas",
            "beyond the level of a mere dilettante & not satisfied with pop-science books,",
            "this might be exactly what you need.",
            "Some background in science or programming is preferred.",
            "3 months starting from September 10, 2024.",
            "Fees: 499 USD or Rs. 42,000"
        ];

        const equations = [
            "E = mc²",
            "F = G(m₁m₂)/r²",
            "∇ × B = μ₀J + μ₀ε₀∂E/∂t",
            "iℏ∂ψ/∂t = Ĥψ",
            "S = k ln W",
            "PV = nRT",
            "∫ e^x dx = e^x + C",
            "∇ · E = ρ/ε₀",
            "d/dx[f(x)g(x)] = f'(x)g(x) + f(x)g'(x)",
            "∑(n=1 to ∞) 1/n² = π²/6",
        ];

        function getRandomPosition(width, height) {
            return {
                x: Math.floor(Math.random() * (width - 10)),
                y: Math.floor(Math.random() * (height - 6))
            };
        }

        function replaceAt(str, row, col, replacement) {
            const lines = str.split('\n');
            for (let i = 0; i < replacement.length; i++) {
                if (row + i < lines.length) {
                    lines[row + i] = lines[row + i].substring(0, col) + 
                                     replacement[i] + 
                                     lines[row + i].substring(col + replacement[i].length);
                }
            }
            return lines.join('\n');
        }

        function animate() {
            let currentFrame = baseStructure;

            // Add text fragments
            const textPos = {x: 45, y: 7};
            const text = textFragments[Math.floor(frame / 180) % textFragments.length];
            const wrappedText = wrapText(text, 40);
            currentFrame = replaceAt(currentFrame, textPos.y, textPos.x, wrappedText);

            // Add equation
            if (frame % 180 === 0) {
                const equation = equations[Math.floor(Math.random() * equations.length)];
                const eqPos = getRandomPosition(40, 15);
                currentFrame = replaceAt(currentFrame, eqPos.y, eqPos.x, [equation]);
            }

            // Animate symbols (every 2 seconds)
            if (frame % 60 === 0) {
                const symbols = '☿☽☾☉♄♃♀♂⚛⚗◊□∇∞☼◯';
                for (let i = 0; i < currentFrame.length; i++) {
                    if (symbols.includes(currentFrame[i]) && Math.random() < 0.05) {
                        const randomSymbol = symbols[Math.floor(Math.random() * symbols.length)];
                        currentFrame = currentFrame.substring(0, i) + randomSymbol + currentFrame.substring(i + 1);
                    }
                }
            }

            // Add some noise (every frame, but less of it)
            for (let i = 0; i < 10; i++) {
                const pos = getRandomPosition(80, 20);
                const noise = Math.random() < 0.5 ? '.' : ' ';
                currentFrame = replaceAt(currentFrame, pos.y, pos.x, [noise]);
            }

            canvas.textContent = currentFrame;
            frame++;
            setTimeout(() => requestAnimationFrame(animate), 33); // ~30 fps
        }

        function wrapText(text, maxLength) {
            const words = text.split(' ');
            let lines = [];
            let currentLine = '';

            words.forEach(word => {
                if ((currentLine + word).length <= maxLength) {
                    currentLine += (currentLine ? ' ' : '') + word;
                } else {
                    lines.push(currentLine);
                    currentLine = word;
                }
            });
            lines.push(currentLine);

            return lines;
        }

        animate();
    </script>
</body>
</html>
